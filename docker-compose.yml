services:
  spark-ml:
    build:
      context: .
      dockerfile: training/Dockerfile
    working_dir: /app
    volumes:
      - ${TENNIS_DATASET_DIR:-./training/data/processed}:/app/training/data/processed:ro
      - ./training/artifacts:/app/training/artifacts

  spark-streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-tennis-points}
      SPARK_CHECKPOINT_LOCATION: /app/checkpoints/kafka-reader
      ELASTICSEARCH_NODES: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_INDEX: tennis-predictions
    volumes:
      - ./streaming:/app/streaming:ro
      - ./training/config:/app/training/config:ro
      - ./training/data/players:/app/training/data/players:ro
      - ./training/artifacts/model:/app/training/artifacts/model:ro
      - streaming-checkpoints:/app/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      node.name: es01
      cluster.name: tennis-cluster
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./visualization/tennis-dashboard.ndjson:/tmp/tennis-dashboard.ndjson:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS --max-time 60 -X POST 'http://kibana:5601/api/saved_objects/_import?overwrite=true' \
          -H 'kbn-xsrf: true' --form file=@/tmp/tennis-dashboard.ndjson \
          -o /tmp/kibana-import.json
        cat /tmp/kibana-import.json
        grep -Eq '"success"[[:space:]]*:[[:space:]]*true' /tmp/kibana-import.json
    restart: "no"

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-tennis-points}
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    restart: "no"

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./visualization/tennis-predictions-template.json:/tmp/tennis-predictions-template.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X PUT http://elasticsearch:9200/_index_template/tennis-predictions \
          -H 'Content-Type: application/json' --data-binary @/tmp/tennis-predictions-template.json
    restart: "no"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-tennis-points}
      PIPELINE_WORKERS: 1
      PIPELINE_ORDERED: "true"
      PIPELINE_ECS_COMPATIBILITY: disabled
      LS_JAVA_OPTS: -Xms256m -Xmx512m
    volumes:
      - ./ingestion/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.5
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      TENNIS_WEBSOCKET_URL: ${TENNIS_WEBSOCKET_URL:-wss://wss.api-tennis.com/live?APIkey=${API_TENNIS_KEY:-}&timezone=Europe/Rome}
    volumes:
      - ./ingestion/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started

volumes:
  kafka-data:
  filebeat-data:
  streaming-checkpoints:
  elasticsearch-data:
