input {
  beats {
    id => "tennis_filebeat_input"
    port => 5044
  }
}

filter {
  # Copia testuale per confrontare chiavi numeriche o stringhe, senza cambiare il payload.
  mutate {
    add_field => { "[@metadata][tournament_key]" => "%{[match][tournament_key]}" }
  }
  # Filebeat produce un evento per match, anche se il feed invia un array.
  # Ignoriamo heartbeat e messaggi senza un match.
  if "_jsonparsefailure" in [tags] or ![match][event_key] {
    drop { id => "drop_missing_match_id" }
  } else if [match][event_type_type] !~ /(?i)^atp singles$/ {
    drop { id => "drop_non_atp_singles" }
  } else if [@metadata][tournament_key] not in [
    "1236", "2155", "2053", "1217",
    "1903", "1928", "1970", "2004", "2011",
    "2078", "1210", "1667", "1725"
  ] {
    drop { id => "drop_unlisted_tournament" }
  } else {
    # Blocchi separati per applicare copia e conversioni in questo ordine.
    mutate {
      id => "copy_match_id"
      copy => { "[match][event_key]" => "match_id" }
    }
    mutate {
      id => "match_id_to_integer"
      convert => { "match_id" => "integer" }
    }
    mutate {
      id => "normalize_match_id"
      convert => { "match_id" => "string" }
      add_field => {
        "event_type" => "match_update"
        "source" => "api-tennis"
      }
    }
    if "_mutate_error" in [tags] or [match_id] !~ /^[1-9][0-9]*$/ {
      drop { id => "drop_invalid_match_id" }
    }
  }
}

output {
  kafka {
    id => "tennis_kafka_output"
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    topic_id => "${KAFKA_TOPIC}"
    message_key => "%{[match_id]}"
    codec => json
    acks => "all"
  }
}
