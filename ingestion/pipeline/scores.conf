input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    topics => ["${KAFKA_TOPIC:tennis-points}"]
    auto_offset_reset => "latest"
    enable_auto_commit => false
    decorate_events => "basic"
    codec => json { target => "snapshot" }
  }
}

filter {
  if ![snapshot][match_id] {
    drop { }
  }
  mutate {
    copy => {
      "[snapshot][match_id]" => "match_id"
      "[snapshot][match][event_first_player]" => "player_a"
      "[snapshot][match][event_second_player]" => "player_b"
      "[snapshot][match][event_first_player_logo]" => "player_a_logo"
      "[snapshot][match][event_second_player_logo]" => "player_b_logo"
      "[snapshot][match][tournament_name]" => "tournament_name"
      "[snapshot][match][event_status]" => "status"
      "[snapshot][match][event_final_result]" => "set_score"
      "[snapshot][match][scores]" => "scores"
      "[snapshot][match][event_game_result]" => "game_score"
      "[snapshot][match][event_serve]" => "server"
      "[snapshot][match][event_winner]" => "winner"
      "[@metadata][kafka][topic]" => "kafka_topic"
      "[@metadata][kafka][partition]" => "partition"
      "[@metadata][kafka][offset]" => "offset"
    }
    add_field => { "document_id" => "%{kafka_topic}:%{partition}:%{offset}" }
    remove_field => ["snapshot", "@version"]
  }
  date {
    match => ["[@metadata][kafka][timestamp]", "UNIX_MS"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tennis-scores"
    document_id => "%{match_id}"
    version => "%{offset}"
    version_type => "external_gte"
    ilm_enabled => false
  }
}
